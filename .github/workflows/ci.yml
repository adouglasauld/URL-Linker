name: URL Linker CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Core and MacKit tests
        run: swift test
      - name: Build universal app
        run: ./Scripts/bundle-app.sh
      - name: Verify staged signature
        run: codesign --verify --strict '/private/tmp/URLLinker-artifacts/URL Linker.app'
      - uses: actions/upload-artifact@v4
        with:
          name: URL-Linker-development-build
          path: dist/URL-Linker.zip
